# ================================================================
# bff-hub-convocatorias | BFF Hub Convocatorias | Vantix SpA
# ================================================================

# Server
server.port=${BFF_PORT:8081}
server.servlet.context-path=/bff

# ── Microservicio ms-hub-convocatorias ───────────────────────────
ms.hub.base-url=${MS_HUB_BASE_URL:http://localhost:8080/api}

# Rutas del microservicio (configurables sin recompilar)
ms.hub.paths.auth=/auth
ms.hub.paths.convocatorias=/convocatorias
ms.hub.paths.etapas=/etapas
ms.hub.paths.campos=/campos
ms.hub.paths.criterios=/criterios
ms.hub.paths.postulaciones=/postulaciones
ms.hub.paths.evaluaciones=/evaluaciones
ms.hub.paths.usuarios=/usuarios
ms.hub.paths.notificaciones=/notificaciones
ms.hub.paths.dashboard=/dashboard

# ── Seguridad BFF — API Key ──────────────────────────────────────
# En producción inyectar como Secret de Kubernetes: BFF_API_KEY
bff.security.api-key=${BFF_API_KEY:bff-dev-secret-2026}
bff.security.header-name=X-API-Key

# ── Criptografía RSA (para descifrar password del frontend) ──────
# En producción inyectar como Secrets de Kubernetes:
#   BFF_RSA_PRIVATE_KEY  (PKCS8 DER en Base64)
#   BFF_RSA_PUBLIC_KEY   (X.509 DER en Base64)
bff.crypto.private-key=${BFF_RSA_PRIVATE_KEY:}
bff.crypto.public-key=${BFF_RSA_PUBLIC_KEY:}

# ── CORS ─────────────────────────────────────────────────────────
bff.cors.allowed-origins=${BFF_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── RestClient timeout ───────────────────────────────────────────
ms.hub.connect-timeout-ms=${MS_HUB_CONNECT_TIMEOUT:5000}
ms.hub.read-timeout-ms=${MS_HUB_READ_TIMEOUT:30000}

# ── Actuator ─────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoints.web.base-path=/actuator
management.health.defaults.enabled=true

# ── Swagger / SpringDoc ──────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.show-actuator=false

